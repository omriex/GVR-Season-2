<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GVR Season 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Viga&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="main-menu">
        <h1>GVR Season 2</h1>
        <input type="text" id="player-name-input" placeholder="ENTER NAME" maxlength="16" autocomplete="off" spellcheck="false">
        <button id="play-btn">PLAY</button>
    </div>

    <div id="game-ui">
        <div id="stats-layer">
            <div class="bar-container"><div class="bar-fill" id="health-fill"></div></div>
            <div class="bar-container"><div class="bar-fill" id="energy-fill"></div></div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
